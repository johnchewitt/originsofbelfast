# Build, test and publish Belfast Rising to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables).
# All of them end up in public JavaScript — never store a secret in one.
#   VITE_ARCGIS_API_KEY          referrer-restricted ArcGIS key (optional)
#   VITE_ASSISTANT_ENDPOINT      URL of server/assistant-proxy (optional)
#   VITE_HISTORIC_MAP_SERVICES   JSON array of extra overlay services (optional)
#   VITE_ARCGIS_LOCAL_ASSETS     "true" to self-host the SDK assets (+~85 MB)
#   FETCH_OSM                    "true" to download OpenStreetMap street geometry before building
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download OpenStreetMap street geometry (optional)
        if: ${{ vars.FETCH_OSM == 'true' }}
        run: npm run data:osm

      - name: Validate curated data
        run: npm run data:validate

      - name: Unit tests
        run: npm test

      - name: Copy ArcGIS assets (optional)
        if: ${{ vars.VITE_ARCGIS_LOCAL_ASSETS == 'true' }}
        run: npm run assets:copy

      - name: Type-check and build
        run: npm run build
        env:
          VITE_ARCGIS_API_KEY: ${{ vars.VITE_ARCGIS_API_KEY }}
          VITE_ASSISTANT_ENDPOINT: ${{ vars.VITE_ASSISTANT_ENDPOINT }}
          VITE_HISTORIC_MAP_SERVICES: ${{ vars.VITE_HISTORIC_MAP_SERVICES }}
          VITE_ARCGIS_LOCAL_ASSETS: ${{ vars.VITE_ARCGIS_LOCAL_ASSETS }}

      - name: Configure Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Upload site
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
